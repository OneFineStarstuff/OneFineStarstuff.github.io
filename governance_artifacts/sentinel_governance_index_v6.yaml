# =============================================================================
# Sentinel Governance Index v6.0
# =============================================================================
# The authoritative index of the 24 governance artifacts that constitute the
# constitutional layer of the Sentinel AI Governance Stack v2.4 /
# Omni-Sentinel Mesh v4.0 as of 27 June 2026.
#
# Every entry names a REAL file in this repository, its constitutional role
# (GIES module: GIMM / GIAF / GEE / META), the invariant(s) or claims it
# carries, and how it is verified. `validate_governance_index.py` checks that
# every referenced path exists, every runnable artifact is covered by the
# runnable assurance suite, and the index is internally consistent
# (24 unique IDs SGI-01..SGI-24, no duplicate paths, GIES modules valid).
#
# Feasibility tiers (honest disclosure):
#   A = runnable + verified in this repo    B = runnable design-level model
#   C = declarative artifact (validated schema/format)   D = prose/organisational
# =============================================================================
