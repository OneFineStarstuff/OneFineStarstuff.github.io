apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gien-node-api-default-deny
  namespace: gien-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gien-node-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gien-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress: []
