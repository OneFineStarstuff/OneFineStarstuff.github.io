apiVersion: apps/v1
kind: Deployment
metadata:
  name: gien-node-api
  namespace: gien-system
  labels:
    app.kubernetes.io/name: gien-node-api
    app.kubernetes.io/part-of: gien-supervisory-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gien-node-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gien-node-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_WITH_ORG/gien-node-api@sha256:REPLACE_WITH_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
