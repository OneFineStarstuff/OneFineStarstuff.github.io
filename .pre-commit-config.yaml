repos:
  - repo: local
    hooks:
      - id: governance-report-pack-validate
        name: governance-report-pack-validate
        entry: make governance-validate
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: governance-report-pack-check
        name: governance-report-pack-check
        entry: make governance-check
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      # Apply whitespace normalization to source and configuration files. The
      # archival Markdown corpus and generated JSON snapshots have existing format
      # differences that would otherwise cause broad, unrelated rewrites. Global
      # YAML/JSON syntax checks and governance artifact validators remain enabled.
      - id: end-of-file-fixer
        files: '^(?:.*\.(?:py|ya?ml|json|jsonc|js|jsx|ts|tsx|sh|toml|ini|cfg)|Makefile)$'
        exclude: '(^gsm_transition_circuit_js/gsm_transition_circuit\.wasm$|^firebase-debug\.log$|^governance_artifacts/oscal/generated/|^docs/reports/artifacts/|^\.idx/)'
      - id: trailing-whitespace
        files: '^(?:.*\.(?:py|ya?ml|json|jsonc|js|jsx|ts|tsx|sh|toml|ini|cfg)|Makefile)$'
        exclude: '(^gsm_transition_circuit_js/gsm_transition_circuit\.wasm$|^firebase-debug\.log$|^governance_artifacts/oscal/generated/|^docs/reports/artifacts/|^\.idx/)'
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint", "docs/schemas/agi_asi_governance_profile_2026_2030.yaml"]
  - repo: local
    hooks:
      - id: governance-validate
        name: governance-validate
        entry: make governance-validate
        language: system
        pass_filenames: false
      - id: governance-policy-test
        name: governance-policy-test
        entry: make governance-policy-test
        language: system
        pass_filenames: false
      - id: governance-validator-test
        name: governance-validator-test
        entry: make governance-validator-test
        language: python
        additional_dependencies:
          - pyyaml==6.0.3
          - jsonschema==4.25.1
        pass_filenames: false
      - id: governance-evidence-checks
        name: governance-evidence-checks
        entry: bash -lc 'make governance-evidence-manifest && make governance-evidence-verify && make governance-evidence-schema && make governance-report-schema && make governance-check-generated'
        language: python
        additional_dependencies:
          - pyyaml==6.0.3
          - jsonschema==4.25.1
        pass_filenames: false
  - repo: local
    hooks:
      - id: governance-validation-suite
        name: governance validation suite
        entry: python3 governance_blueprint/validation/run_validation_suite.py --skip-selftest --quiet
        language: system
        pass_filenames: false
        files: '^(governance_blueprint/|ENTERPRISE_AGI_ASI_GOVERNANCE_BLUEPRINT_2026_2030\.md)'
