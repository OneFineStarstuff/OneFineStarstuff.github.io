name: GIEN Console CI

on:
  pull_request:
    paths:
      - 'gien-console/**'
      - '.github/workflows/gien-console-ci.yml'
  push:
    branches:
      - main
      - 'feat/gien-console-first-slice'
    paths:
      - 'gien-console/**'
      - '.github/workflows/gien-console-ci.yml'

permissions:
  contents: read

concurrency:
  group: gien-console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '24'

      - name: Resolve lockfile only when no committed lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            echo "Using committed package-lock.json"
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
        working-directory: gien-console

      - name: Install dependencies from resolved lockfile
        run: npm ci --no-audit --no-fund
        working-directory: gien-console

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: gien-console

      - name: Run unit tests
        run: npm test
        working-directory: gien-console

      - name: Type-check
        run: npm run typecheck
        working-directory: gien-console

      - name: Build production bundle
        run: npm run build
        working-directory: gien-console

      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: gien-console-package-lock
          path: gien-console/package-lock.json
          if-no-files-found: warn

  # Bootstrap the lockfile only from a trusted direct push to this maintained branch.
  # This job is always skipped for pull_request events. npm/audit/test steps run in
  # the read-only validate job; the write token is used only in the final git push step.
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/gien-console-first-slice'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check whether a lockfile is still needed
        id: lockfile
        run: |
          if [ -f gien-console/package-lock.json ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the lockfile validated by the read-only job
        if: steps.lockfile.outputs.needed == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: gien-console-package-lock
          path: lock-artifact

      - name: Place the validated lockfile
        if: steps.lockfile.outputs.needed == 'true'
        run: |
          test -s lock-artifact/package-lock.json
          install -D -m 0644 lock-artifact/package-lock.json gien-console/package-lock.json

      - name: Commit the lockfile on the trusted branch
        if: steps.lockfile.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gien-console/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(gien-console): commit CI-validated lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD:refs/heads/feat/gien-console-first-slice
