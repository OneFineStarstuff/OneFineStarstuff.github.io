name: GIEN Evidence API CI

on:
  push:
    branches: [main]
    paths:
      - 'gien-evidence-api/**'
      - '.github/workflows/gien-evidence-api-ci.yml'
  pull_request:
    paths:
      - 'gien-evidence-api/**'
      - '.github/workflows/gien-evidence-api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Contract tests and syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
        working-directory: gien-evidence-api
      - name: Run fail-closed contract tests
        run: npm test
        working-directory: gien-evidence-api
