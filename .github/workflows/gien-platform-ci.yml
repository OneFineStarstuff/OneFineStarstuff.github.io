name: GIEN platform CI

on:
  pull_request:
    paths:
      - "gien-platform/**"
      - ".github/workflows/gien-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "gien-platform/**"
      - ".github/workflows/gien-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gien-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gien-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gien-platform/package.json
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
