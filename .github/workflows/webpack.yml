name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "22"
      - name: Build when a webpack config is present
        run: |
          if [ -f webpack.config.js ] || [ -f webpack.config.cjs ] || [ -f webpack.config.mjs ]; then
            npm install
            npx webpack
          else
            echo "No root webpack config; skipping."
          fi
