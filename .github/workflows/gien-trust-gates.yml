name: gien-trust-gates

# WP-119 (CI trust gate wiring, wave P0 of the EU AI Act / DORA compliance plan).
# Wakes the dormant WP-114 backbone: determinism scan, crosswalk validation,
# OSCAL drift diff, reproducible build, e2e trust invariants.
# All actions in this workflow are pinned to immutable full commit SHAs.
# Simulated governance artefact.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Determinism scan (Math.random ban, A1 companion)
        run: |
          chmod +x scripts/determinism_scan.sh
          ./scripts/determinism_scan.sh
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate compliance crosswalk (B7)
        run: |
          npm install --no-save yaml@^2 ajv@^8
          node scripts/validate_crosswalk.mjs
  oscal-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: OSCAL drift diff vs base (exit 2 keeps the gate red)
        run: |
          git fetch origin main
          node scripts/oscal_diff.mjs --base origin/main
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: "Reproducible build gate (A4; prints REPRODUCIBLE: <hash> or exits 1)"
        run: |
          chmod +x scripts/reproducible-build.sh
          ./scripts/reproducible-build.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install webapp deps and Playwright
        run: |
          cd webapp && npm install && npx playwright install --with-deps
      - name: Watermark and p(doom) trust invariants (A2, A3)
        run: npx playwright test tests/e2e/watermark.spec.ts tests/e2e/pdoom.spec.ts
