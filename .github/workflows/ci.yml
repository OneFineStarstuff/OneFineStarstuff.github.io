name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Report toolchain versions
        run: |
          python --version
          python -m pip --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Critical Ruff checks
        run: ruff --format=github --select=E9,F63,F7,F82 --target-version=py310 .
      - name: Full Ruff lint
        run: ruff --format=github --target-version=py310 .
      - name: Run pytest
        run: pytest
