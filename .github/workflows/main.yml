name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && vars.DOCKER_IMAGE != '' }}
        uses: docker/login-action@0d4c9c5f114e0051d914bca15554477dd762a938
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Without explicit registry configuration, this workflow performs a build-only check.
      - name: Build image (push only when configured)
        uses: docker/build-push-action@ad82d024503b15000a683bdffec2bb5c0ccca10c
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && vars.DOCKER_IMAGE != '' }}
          tags: ${{ vars.DOCKER_IMAGE != '' && vars.DOCKER_IMAGE || 'local/agi-pipeline:ci' }}
